name: TTE replay feature and upstream baseline verification
on:
  push:
    branches: [codex/preflight-tte-feature]
permissions:
  contents: read
jobs:
  replay:
    name: Replay / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GreedyC/terminaltexteffects
          ref: 42524313d88b2d10f3ec75f9bda23a9719f2ae09
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest pytest-xdist shtab==1.9.2 ruff pyright build
      - name: Replay, lifecycle, parser and completion generation
        run: python -m pytest -n 2 tests/test_cli_repeat.py tests/engine_tests/test_base_effect.py tests/test_cli.py::test_build_parser_registers_effects tests/test_cli.py::test_bundled_completion_scripts_are_current
      - name: Quality and package build
        run: |
          python -m tools.generate_shell_completions --check
          python -m ruff check terminaltexteffects/__main__.py tests/test_cli_repeat.py
          python -m pyright terminaltexteffects/__main__.py tests/test_cli_repeat.py
          python -m build
  baseline:
    name: Reproduce known failures on unchanged upstream base
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GreedyC/terminaltexteffects
          ref: 8a1ce8ba9a640b12b6b1777b1658725e119ced01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e . pytest shtab==1.9.2
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Unmodified Swarm regression is nondeterministic
        shell: bash
        run: |
          python - <<'PY'
          import random
          import runpy
          test = runpy.run_path('tests/effects_tests/test_swarm.py')['test_swarm_coordination_advances_past_area_nine']
          failures = []
          for seed in range(100):
              random.seed(seed)
              try:
                  test(0, '9_swarm_area')
              except AssertionError:
                  failures.append(seed)
          print('Unchanged base failing seeds:', failures)
          assert failures, 'Expected baseline Swarm failure was not reproduced'
          PY
      - name: Unmodified zsh bootstrap fails in this Linux runner
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          result = subprocess.run([sys.executable, '-m', 'pytest', '-q', 'tests/test_cli.py::test_zsh_completion_registers_in_clean_shell'], capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          assert result.returncode == 1
          assert 'not interactive and can' in result.stdout
          assert 'compinit: initialization aborted' in result.stdout
          PY
